name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and VERSION differ.' }
      - name: Locate or install Inno Setup
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) { choco install innosetup --version=6.4.3 --yes --no-progress }
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup compiler unavailable.' }
          "ISCC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build, regression and embedded WPF checks
        shell: pwsh
        run: .\scripts\Build.ps1 -Iscc $env:ISCC
      - name: Installer lifecycle checks
        shell: pwsh
        run: .\scripts\Test-Installer.ps1 -Iscc $env:ISCC -TestRoot (Join-Path $env:RUNNER_TEMP ('vfm-installer-' + [guid]::NewGuid().ToString('N')))
      - uses: actions/upload-artifact@v4
        with:
          name: ViewFilterManager-Revit2026
          path: |
            artifacts/*-Setup.exe
            artifacts/*-portable.zip
            artifacts/SHA256SUMS.txt
            artifacts/preview/*.png
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ViewFilterManager-Revit2026
          path: release
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --title "View Filter Manager $GITHUB_REF_NAME (Revit 2026)" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" release/*-Setup.exe release/*-portable.zip release/SHA256SUMS.txt --clobber
